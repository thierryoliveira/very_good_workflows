name: deploy

on:
  push:
    branches:
      - refactor/jaspr-migration
    paths:
      - '.github/workflows/site_deploy.yaml'
      - 'site_jaspr/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: site_jaspr

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: 📦 Install Jaspr CLI
        run: dart pub global activate jaspr_cli

      - name: 🔐 Configure Git for private packages
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 👷 Build
        run: jaspr build --verbose

      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_jaspr/build/jaspr

  deploy:
    name: Deploy

    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
